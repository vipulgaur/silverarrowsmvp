name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Lint is report-only for now: the repository has a large backlog of
      # pre-existing Prettier formatting findings. Keep it visible in CI without
      # blocking, and flip `continue-on-error` to false after a dedicated
      # `npm run format` pass has cleared the backlog.
      - name: Lint (report-only)
        run: npm run lint
        continue-on-error: true
