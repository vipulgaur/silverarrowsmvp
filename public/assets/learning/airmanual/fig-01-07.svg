<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Aircraft ignition switch dial">
  <rect width="480" height="320" fill="#ffffff"/>
  <g fill="none" stroke="#1f2937" stroke-width="2">
    <circle cx="240" cy="165" r="110"/>
    <circle cx="240" cy="165" r="98" stroke="#9ca3af"/>
    <circle cx="240" cy="165" r="18" fill="#1f2937"/>
  </g>
  <!-- key turned diagonally -->
  <g stroke="#1f2937" stroke-width="3" fill="#374151">
    <line x1="240" y1="165" x2="300" y2="105" stroke-width="6"/>
    <rect x="296" y="86" width="26" height="14" rx="3" transform="rotate(-45 309 93)"/>
  </g>
  <!-- position ticks + labels -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">
    <line x1="150" y1="230" x2="138" y2="242" stroke="#1f2937" stroke-width="2"/>
    <text x="120" y="250">OFF</text>
    <line x1="165" y1="120" x2="150" y2="108" stroke="#1f2937" stroke-width="2"/>
    <text x="138" y="104">R</text>
    <line x1="210" y1="80" x2="205" y2="62" stroke="#1f2937" stroke-width="2"/>
    <text x="203" y="56">L</text>
    <line x1="270" y1="80" x2="278" y2="62" stroke="#1f2937" stroke-width="2"/>
    <text x="300" y="56">BOTH</text>
    <line x1="330" y1="230" x2="345" y2="242" stroke="#1f2937" stroke-width="2"/>
    <text x="378" y="250">START PUSH</text>
  </g>
  <text x="240" y="305" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Fig 1-7 — The ignition switch</text>
</svg>
