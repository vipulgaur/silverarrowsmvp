<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="VHF-COM radio control panel">
  <rect width="520" height="220" fill="#ffffff"/>
  <rect x="30" y="40" width="460" height="120" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <!-- display -->
  <rect x="55" y="70" width="150" height="54" rx="6" fill="#0b1b2b" stroke="#1f2937" stroke-width="2"/>
  <text x="65" y="90" font-family="Arial, sans-serif" font-size="12" fill="#60a5fa">COMM 1</text>
  <text x="130" y="116" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#34d399" text-anchor="middle">124.95</text>
  <!-- concentric rotary dial -->
  <g fill="none" stroke="#1f2937" stroke-width="2">
    <circle cx="340" cy="100" r="42"/>
    <circle cx="340" cy="100" r="22" fill="#d1d5db"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="300" y="70">OFF</text>
    <text x="340" y="52">ON</text>
    <text x="384" y="70">TEST</text>
  </g>
  <!-- small knobs -->
  <g>
    <circle cx="430" cy="80" r="16" fill="#d1d5db" stroke="#1f2937" stroke-width="2"/>
    <text x="430" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">VOL</text>
    <circle cx="470" cy="80" r="16" fill="#d1d5db" stroke="#1f2937" stroke-width="2"/>
    <text x="470" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">SQ</text>
  </g>
  <text x="260" y="195" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Fig 1-8 — Control panel of a typical VHF-COM radio</text>
</svg>
